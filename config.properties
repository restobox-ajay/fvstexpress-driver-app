# =====================================================================
#  FVST Express Driver app — server settings
#  Change these values, then rebuild the app (Build › Rebuild Project).
# =====================================================================

# Base URL of the admin app's driver API. Must end with /driver-api/v1/
#   Android emulator + WAMP on this PC : http://10.0.2.2/driver-api/v1/
#   Real phone on the same Wi-Fi       : http://192.168.x.x/driver-api/v1/   (your PC's LAN IP)
#   Live server                        : https://your-admin-domain.com/driver-api/v1/
api.baseUrl=https://fvstexpress-app.dev.rp017.webhelplogin.com/driver-api/v1/

# WAMP serves the admin app on the fvstexpress-admin.local virtual host, so the app sends that name as
# the Host header when the base URL is an IP address. Leave empty when the base URL already uses the
# real host name (e.g. the live server).
api.hostHeader=

# false = log in and load real data from the API above (normal).
# true  = demo mode with built-in sample data, no server needed (any login + PIN works).
api.useMock=false

# Dispatch phone for "Call Dispatch" until the server sends one in /me.
dispatch.phone=+16045550100
